server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api {
    proxy_pass http://inventoria-backend-prod:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.webmanifest$ {
    default_type application/manifest+json;
  }

  location /s3/ {
    proxy_pass http://s3-prod:9000/;
    proxy_set_header Host s3-prod:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # The update check re-downloads sw.js on every launch — never let the
  # Cloudflare edge serve a stale copy or updates stop propagating
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Re-auth escape hatch: the service worker lets this navigation through
  # to the network, so an expired session hits the Cloudflare Access login
  # before landing back here and getting bounced to the app
  location = /reauth {
    return 302 /;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
